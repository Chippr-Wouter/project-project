  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectProject</title>
    <link rel="icon" type="image/svg+xml" href="/icon/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/icon/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icon/apple-touch-icon.png" />
    <link rel="manifest" href="/icon/site.webmanifest" />
    <script>
      // Set the theme class before React mounts to avoid a light->dark flash.
      // Mirrors the logic in src/hooks/useTheme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem("projectproject:theme")
          var pref =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system"
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref
          if (resolved === "dark")
            document.documentElement.classList.add("dark")
        } catch (_) {}
      })()
    </script>
    <style>
      @property --pp-sweep {
        syntax: "<number>";
        inherits: false;
        initial-value: -100;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        background: #ffffff;
        opacity: 1;
        transition: opacity 0.35s ease;
      }
      .dark #app-loader {
        background: #0a0a0a;
      }
      html[data-app-ready] #app-loader {
        opacity: 0;
        pointer-events: none;
      }
      #app-loader .pp-loader {
        width: 112px;
        height: 112px;
        -webkit-mask-image: linear-gradient(
          81deg,
          rgba(0, 0, 0, 0.32) calc((var(--pp-sweep) - 69) * 1%),
          #000 calc(var(--pp-sweep) * 1%),
          rgba(0, 0, 0, 0.32) calc((var(--pp-sweep) + 69) * 1%)
        );
        mask-image: linear-gradient(
          81deg,
          rgba(0, 0, 0, 0.32) calc((var(--pp-sweep) - 69) * 1%),
          #000 calc(var(--pp-sweep) * 1%),
          rgba(0, 0, 0, 0.32) calc((var(--pp-sweep) + 69) * 1%)
        );
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        animation: pp-sweep 1.8s linear infinite;
      }
      #app-loader .pp-loader > svg {
        width: 100%;
        height: 100%;
      }
      @keyframes pp-sweep {
        from {
          --pp-sweep: -100;
        }
        to {
          --pp-sweep: 200;
        }
      }
      #app-loader path[fill="#FEFEFE"] {
        fill: #111111;
      }
      #app-loader path[fill="#807F7F"] {
        fill: #8a8a8a;
      }
      .dark #app-loader path[fill="#FEFEFE"] {
        fill: #ededed;
      }
      .dark #app-loader path[fill="#807F7F"] {
        fill: #6b6b6b;
      }
      @media (prefers-reduced-motion: reduce) {
        #app-loader .pp-loader {
          animation: none;
          -webkit-mask-image: none;
          mask-image: none;
        }
      }
    </style>
  </head>
