name: ci

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Check
        run: vp run check

      - name: Test
        run: vp run test

      - name: Build
        run: vp run build
