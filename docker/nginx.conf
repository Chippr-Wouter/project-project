# nginx config for the frontend container.
#
# Serves the Vite build as static files; falls back to /index.html for
# unknown paths (TanStack Router needs the SPA-fallback). Proxies /api/*
# to the backend container by Docker DNS name (`app`).
#
# This container sits behind nginx-proxy-manager on the host — NPM
# terminates TLS and forwards to this container's port 80.

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Static assets — let nginx cache them aggressively. Vite hashes filenames
  # so cache-busting is free.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # API + auth — proxy untouched paths to the backend. `app` is the
  # docker-compose service name; Docker's embedded DNS resolves it.
  location /api/ {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /mcp {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /.well-known/ {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback: any path not matched above falls back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
